# Single source of tunables — every module reads from here (plan §7 T1).
provider: the_odds_api
sports: [basketball_wnba]
regions: [us, eu]
my_books: []                   # books the owner can actually bet; alerts fire ONLY for these
exchange_books: {betfair_ex_eu: 0.02}             # name -> commission rate, e.g. {novig: 0.02}
edge_threshold: 0.02           # research signal floor (logged)
live_bet_edge_min: 0.035       # alert window floor (plan §4.7)
max_edge: 0.08                 # adverse-selection ceiling (validated by EV buckets, §4.3)
min_books: 4
staleness_sync_minutes: 5
execution_price_tolerance: 0.04
alert_expiry_minutes: 4
max_offshore_fraction: 0.30
bankroll: 0                    # set before any live sizing; 0 disables stake output
kelly_fraction: 0.25
stake_increment: 5
anchor_book: pinnacle
fair_line_mode: consensus      # 'anchor' (Pinnacle) or 'consensus' (weighted all-books)
anchor_overround_band: [0.015, 0.08]
soft_overround_band: [0.015, 0.15]
